# Supabase's free tier pauses a project after about a week without database
# activity, which takes the whole site down. Every 3 days this loads real data
# through the live site (Cloudflare -> Render -> Postgres), so the database
# sees a query. The first try may hit a sleeping Render instance, so it retries.
name: Keep database awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the live API
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -m 60 -o /dev/null -w '%{http_code}' https://pricepulse-cw6.pages.dev/api/products/most-wishlisted)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 60
          done
          echo "API did not answer; check Render and Supabase."
          exit 1
