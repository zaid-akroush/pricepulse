# Local development only. The live site does not run through this file:
# the frontend auto-deploys from GitHub via Cloudflare Pages and the backend
# auto-deploys from GitHub via Render (see render.yaml and README.md).
# Use this to run the whole stack on your machine while developing.
version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pricepulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/pricepulse
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-brightdata}
      BRIGHTDATA_API_KEY: ${BRIGHTDATA_API_KEY}
      BRIGHTDATA_SERP_ZONE: ${BRIGHTDATA_SERP_ZONE}
      SERP_API_KEY: ${SERP_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:alerts@pricepulse.app}
      CLIENT_URL: https://pricepulse-cw6.pages.dev,https://b163b7a0.pricepulse-cw6.pages.dev,http://localhost:3000,http://localhost,http://localhost:5173,http://localhost:4173
      PORT: 5000
    ports:
      - '5050:5000'
    command: >
      sh -c "npx prisma generate && npx prisma migrate deploy && node src/server.js"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'

volumes:
  pgdata:
