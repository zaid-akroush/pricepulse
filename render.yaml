# Render Blueprint: deploys the PricePulse backend as an always-online (free
# tier), auto-deploying web service. Render rebuilds and redeploys this
# service automatically on every push to the connected GitHub branch, so
# once this is set up there is nothing to run locally to keep the API live.
#
# One-time setup (see README.md "Hosting" section for the full walkthrough):
#   1. Push this repo to GitHub.
#   2. In the Render dashboard: New -> Blueprint -> connect this repo.
#   3. Render finds this file and creates the "pricepulse-api" service below.
#   4. Fill in the secret values it prompts for (DATABASE_URL, JWT_SECRET, etc).
#   5. Copy the service's onrender.com URL into the Cloudflare Pages
#      BACKEND_URL secret (one time only, see README).
#
# The database itself is NOT defined here. Render's free Postgres expires
# 30 days after creation, so this project uses a separate free Supabase
# Postgres project instead (no time-based expiry) and only points
# DATABASE_URL at it.

services:
  - type: web
    name: pricepulse-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -c "npx prisma migrate deploy && node src/server.js"
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SEARCH_PROVIDER
        value: brightdata
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: BRIGHTDATA_SERP_ZONE
        sync: false
      - key: SERP_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:alerts@pricepulse.app
      - key: CLIENT_URL
        sync: false
      - key: INTERNAL_PROXY_SECRET
        sync: false
      - key: CRON_SCHEDULE
        value: "0 */6 * * *"
      - key: PORT
        value: "5000"
