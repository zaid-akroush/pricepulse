services:
  # Backend API
  - type: web
    name: pricepulse-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pricepulse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SERP_API_KEY
        sync: false          # set manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false          # set manually in Render dashboard
      - key: CLIENT_URL
        value: https://pricepulse-frontend.onrender.com
      - key: NODE_ENV
        value: production
      - key: CRON_SCHEDULE
        value: "0 */6 * * *"

  # Frontend (static site)
  - type: web
    name: pricepulse-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pricepulse-backend.onrender.com

databases:
  - name: pricepulse-db
    databaseName: pricepulse
    plan: free
